<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вайбкодинг — домашнее задание №3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
    }

    .card {
      width: min(700px, 90%);
      padding: 50px 35px;
      text-align: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    .success {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>💻 Вайбкодинг</h1>
    <p>Домашнее задание №3</p>
    <p>Интеграция Cursor и GitHub</p>
    <div class="success">✅ Проект успешно опубликован на GitHub Pages</div>
  </div>
</body>
</html>
